name: Daily Feishu report
on:
  schedule:
    - cron: '42 17 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nankai-notice-state
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install .
      - name: Crawl, checkpoint and deliver daily report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/run_action.py daily
      - name: Retain public state for recovery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-state-recovery-${{ github.run_id }}
          path: state-data/state.json
          retention-days: 7
          if-no-files-found: ignore
